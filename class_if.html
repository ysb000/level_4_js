<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래스 제어_조건문 기초</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <script src="./scripts/class_if.js"defer></script>
    <style>
