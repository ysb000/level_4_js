<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login | siteName</title>
    <link rel="stylesheet" href="./styles/login.css">
    <script src="./scripts/login.js" defer></script>
</head>
<body>
    <div class="top-bnr po-fi flex-r z-index-900">
        <a href="#">카카오톡 플러스 친구 추가 시 3,000원 쿠폰!</a>
        <a href="#" class="close po-ab"><img src="./images/close.png" alt="카카오톡 광고 닫기"></a>
    </div>
    <main>
        <div class="top flex-r">
            <a href="javascript:history.back()" class="back"><img src="./images/arrow.png" alt="페이지 뒤로 이동"></a>
            <h1><a href="./index.html">로고</a></h1>
            <a href="./index.html" class="main_link"><img src="./images/home.png" alt="메인으로 이동"></a>
        </div>
        <div class="login-box flex-c">
            <h1>로그인</h1>
            <p>최대 1만원 쿠폰팩 증정</p>
            <p>카플친 추가 & SMS 수신 동의 고객 한정</p>
            <a href="#" class="kakao" target="_blank">카카오 1초 로그인/회원가입</a>
            <div class="welcome-pack flex-c po-re">
                <h2>최대 1만원</h2>
                <p>신규 회원 웰컴 할인 쿠폰팩</p>
            </div>
            <p>카카오 회원 가입 시 즉시 사용가능한 쿠폰을 드려요!</p>
            <p class="po-re"><span class="z-index-900">또는</span></p>
            <form action="#" method="post" id="login-frm">
                <div class="title flex-r">
                    <button type="button" id="member-btn1" class="active">기존 회원</button>
                    <button type="button" id="member-btn2">비회원 주문조회</button>
                </div>
                <div class="contents">
                    <ul class="member">
                        <li class="flex-r"><input type="text" name="user-id" id="user-id" placeholder="아이디"></li>
                        <li class="flex-r">
                            <input type="password" name="user-pw" id="user-pw" placeholder="비밀번호">
                            <button type="button" id="non-member-pw-visible"><img src="./images/hide.png" alt="숨기기"></button>
                        </li>
                        <li>
                            <input type="checkbox" name="id-save" id="id-save">
                            <label for="id-save">아이디 저장</label>
                        </li>
                        <li><button type="button" id="member-login">기존 회원 로그인</button></li>
                        <li class="flex-r-between">
                            <span>
                                <a href="#" class="id-search">아이디 찾기</a>
                                <a href="#" class="pw-search">비밀번호 찾기</a>
                            </span>
                            <a href="#" class="join-btn">회원가입</a>
                        </li>
                    </ul>
                    <ul class="non-member">
                        <li class="flex-r"><input type="text" name="non-user-id" id="non-user-id" placeholder="주문자명"></li>
                        <li class="flex-r"><input type="password" name="non-user-order" id="non-user-order" placeholder="주문번호"></li>
                        <li class="flex-r">
                            <input type="text" name="non-user-pw" id="non-user-pw" placeholder="비회원 주문 비밀번호">
                            <button type="button" id="non-member-pw-visible"><img src="./images/hide.png" alt="숨기기"></button>
                        </li>
                        <li><button type="button" id="non-member-login">비회원 주문조회</button></li>
                    </ul>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
